name: refresh-leads
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); free on GitHub Actions
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Restore SQLite store (keeps analysis + statuses between runs)
        uses: actions/cache@v4
        with:
          path: data
          key: switchsignal-db-${{ github.run_id }}
          restore-keys: switchsignal-db-
      - name: Run pipeline (MCP client -> ticmint-intel server -> Google Sheet)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
        run: python run.py --source trustpilot,csv --path exports/reviews.csv
